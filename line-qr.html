<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TX3Y6G4XWJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TX3Y6G4XWJ');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cursorvers LINE 登録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            en: ['"Manrope"', 'sans-serif'],
          },
          colors: {
            'brand-bg': '#FFFFFF',
            'brand-surface': '#F8FAFC',
            'brand-flame': '#FF4500',
            'brand-gold': '#FF5A1F',
            'brand-slate': '#475569',
            'brand-text-main': '#0F172A',
            'brand-border': '#E2E8F0',
            'line-green': '#06C755',
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: "Noto Sans JP", system-ui, sans-serif;
      background-color: #FFFFFF;
      color: #0F172A;
    }
  </style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex items-center justify-center p-5">
  <main class="max-w-md w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-8 text-center space-y-6">

    <div class="space-y-2">
      <p class="text-xs uppercase tracking-[0.4em] text-brand-flame font-bold font-en">Cursorvers</p>
      <h1 class="text-2xl font-bold text-slate-900">LINE で友だち追加</h1>
      <p class="text-sm text-slate-500">QRコードをスキャンして友だち追加してください</p>
    </div>

    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6">
      <div class="flex flex-col items-center">
        <img
          src="https://qr-official.line.me/gs/M_s2yyhfo_GW.png"
          alt="LINE友だち追加QR"
          class="w-56 h-56 bg-white rounded-xl p-2 shadow-md border border-slate-100 object-contain"
          loading="lazy"
          referrerpolicy="no-referrer"
          onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='https://quickchart.io/qr?text=https://page.line.me/s2yyhfo&size=320';}else if(this.dataset.fallback==='1'){this.dataset.fallback='2';this.src='https://chart.googleapis.com/chart?chs=320x320&cht=qr&chl=https://page.line.me/s2yyhfo&choe=UTF-8';}"
        >
      </div>
    </div>

    <div class="text-xs text-slate-500 space-y-2 text-left bg-slate-50 border border-slate-200 rounded-xl p-4">
      <p class="font-semibold text-slate-700 text-center mb-3">スマホでの手順</p>
      <div class="flex items-start gap-2">
        <span class="w-5 h-5 rounded-full bg-brand-flame/10 text-brand-flame text-xs flex items-center justify-center font-bold shrink-0">1</span>
        <p>QRコードを長押しして保存</p>
      </div>
      <div class="flex items-start gap-2">
        <span class="w-5 h-5 rounded-full bg-brand-flame/10 text-brand-flame text-xs flex items-center justify-center font-bold shrink-0">2</span>
        <p>LINE → 友だち追加 → QRコード → ライブラリから読み込み</p>
      </div>
      <p class="text-slate-400 text-center mt-3">PC: スマホでQRを読み取ってください</p>
    </div>

    <div class="pt-4 border-t border-slate-200 space-y-3">
      <p class="text-xs text-slate-500">
        友だち追加後、メールアドレスを送信すると<br>
        <span class="text-brand-flame font-semibold">Discord コミュニティ招待</span>をお届けします
      </p>
      <a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-brand-flame transition">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        トップページに戻る
      </a>
    </div>

  </main>
</body>
</html>
