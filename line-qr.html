<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cursorvers LINE 登録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-bg': '#050202',
            'brand-flame': '#FF4500',
            'line-green': '#06C755',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-[#0c0c0c] text-white min-h-screen flex items-center justify-center">
  <main class="max-w-md mx-auto px-6 py-10 text-center space-y-6">

    <div class="space-y-2">
      <p class="text-xs uppercase tracking-[0.4em] text-brand-flame font-bold">Cursorvers</p>
      <h1 class="text-2xl font-bold">LINE で友だち追加</h1>
      <p class="text-sm text-white/80">QRコードをスキャンして友だち追加してください</p>
    </div>

    <div class="bg-[#141414] border border-white/10 rounded-2xl p-6 shadow-lg">
      <div class="flex flex-col items-center">
        <img
          src="https://qr-official.line.me/gs/M_s2yyhfo_GW.png"
          alt="LINE友だち追加QR"
          class="w-56 h-56 bg-white rounded-xl p-2 shadow object-contain"
          loading="lazy"
          referrerpolicy="no-referrer"
          onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='https://quickchart.io/qr?text=https://page.line.me/s2yyhfo&size=320';}else if(this.dataset.fallback==='1'){this.dataset.fallback='2';this.src='https://chart.googleapis.com/chart?chs=320x320&cht=qr&chl=https://page.line.me/s2yyhfo&choe=UTF-8';}"
        >
      </div>
    </div>

    <div class="text-xs text-white/60 space-y-2">
      <p class="font-semibold">スマホでの手順</p>
      <p>1. QRコードを長押しして保存</p>
      <p>2. LINE → 友だち追加 → QRコード → ライブラリから読み込み</p>
      <p class="mt-3 text-white/40">PC: スマホでQRを読み取ってください</p>
    </div>

    <div class="pt-4 border-t border-white/10">
      <p class="text-xs text-white/50">
        友だち追加後、メールアドレスを送信すると<br>
        <span class="text-brand-flame">Discord コミュニティ招待</span>をお届けします
      </p>
    </div>

  </main>
</body>
</html>
