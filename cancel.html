<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>決済キャンセル | Cursorvers Edu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .cancel-icon {
            width: 80px;
            height: 80px;
            background: #f59e0b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease-out;
        }

        .cancel-icon svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .info-box {
            background: #fef3c7;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            text-align: left;
            border: 2px solid #fbbf24;
        }

        .info-box h2 {
            font-size: 18px;
            color: #92400e;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .info-box p {
            font-size: 15px;
            color: #78350f;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .button-secondary:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 32px;
            font-size: 14px;
            color: #9ca3af;
        }

        @media (max-width: 640px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cancel-icon">
            <svg viewBox="0 0 24 24">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>

        <h1>決済がキャンセルされました</h1>
        <p class="subtitle">
            決済手続きがキャンセルされました。<br>
            ご不明な点やお困りのことがございましたら、お気軽にお問い合わせください。
        </p>

        <div class="info-box">
            <h2>💡 ご確認ください</h2>
            <p>
                決済を完了するには、カード情報を入力して「Subscribe」ボタンをクリックしてください。
                セキュリティ上の理由でキャンセルされた場合は、別のカードをお試しいただくか、
                カード会社にお問い合わせください。
            </p>
        </div>

        <div class="buttons">
            <a href="https://cursorvers.github.io/cursorvers-edu/services.html" class="button button-primary">
                もう一度試す
            </a>
            <a href="https://cursorvers.github.io/cursorvers-edu/" class="button button-secondary">
                ホームに戻る
            </a>
        </div>

        <p class="footer-note">
            ご質問やサポートが必要な場合は、お気軽にお問い合わせください。<br>
            Library Memberの詳細については、サービスページをご覧ください。
        </p>
    </div>
</body>
</html>
